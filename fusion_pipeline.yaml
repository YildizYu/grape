# ============================================================
# 葡萄果梗三维定位实时融合 Pipeline 配置
# ============================================================

# 注意: 本文件位于 DOBOT 工作区内, 目录为
#   /home/nvidia/thor/Grape_zed/DOBOT_6Axis_ROS2_V4-main/grape_stem_3d_zed_deploy/
# 相对路径均以该目录为基准解析。

# ── 相机配置 (Orbbec Gemini 336 / Thor) ────────────────────
camera:
  model: Orbbec Gemini 336
  color_width: 640
  color_height: 480
  color_fps: 30
  depth_width: 640
  depth_height: 480
  depth_fps: 30
  align_to: color
  alignment_mode: hardware
  serial_number: null          # 多相机时填 Gemini 336 序列号
  # 相机故障检测 (协议 v2.0 FAIL_CAMERA 上报)
  read_fail_threshold: 10      # 连续读帧失败 N 次 → 上报 FAIL_CAMERA (0x06)
  read_fail_sleep_s: 0.1       # 读失败时睡眠, 防止主循环高速空转

# ── 模型配置 ──────────────────────────────────────────────
models:
  grapes_weights: weights/grapes/best.pt
  stem_weights: weights/stem/best.pt
  sam_type: sam3
  sam_checkpoint: sam3_new.pt
  device: "0"

# ── 视觉链选择 ────────────────────────────────────────────
# sam3_keypoint: 正式链 (葡萄 YOLO → 果梗 YOLO → SAM3 mask → 公共骨架三点)
# stem_yolo/keypoint: 历史兼容链，不作为现场主链。
vision:
  chain: sam3_keypoint

# ── 两种分割模型共用的 mask 后处理 ───────────────────────
mask_postprocess:
  pose_offset: 12.0
  min_component_area: 12
  min_path_length: 20.0
  fill_invalid_with_cut: true

# # ── UNet 对比实验参数（正式主程序不读取） ───────────────
# keypoint:
#   worker_python: /home/nvidia/thor/Grape_zed/DOBOT_6Axis_ROS2_V4-main/grape_stem_3d_zed_deploy/.venv-thor/bin/python
#   worker_script: src/grape_stem_3d/stem_keypoint_infer_torch.py
#   unet_weights: weights/unet_mobilenetv2.onnx
#   threshold: 0.80            # 原始预测值严格大于此值才保留
#   pose_offset: 12.0          # CUT 到 P1/P3 的测地距离 (224 坐标空间)
#   min_component_area: 12
#   min_path_length: 20.0
#   ready_timeout_s: 180.0     # worker 启动+模型加载超时
#   job_timeout_s: 60.0        # 单批推理超时
#   fill_invalid_with_cut: true  # P1/P3 深度无效时用 CUT 深度回填
#   # UNet 训练输入是葡萄裁剪图 (与旧果梗 ROI 的大外扩不同)
#   crop_expand_left: 0.05
#   crop_expand_right: 0.05
#   crop_expand_top: 0.30
#   crop_expand_bottom: 0.10

# ── 葡萄检测器参数 ────────────────────────────────────────
grapes_detector:
  confidence: 0.25
  iou: 0.50
  imgsz: 640

# ── ROI 扩展参数 ──────────────────────────────────────────
roi:
  expand_left: 0.15
  expand_right: 0.15
  expand_top: 0.50
  expand_bottom: 0.10

# ── 果梗检测器参数 ────────────────────────────────────────
stem_detector:
  confidence: 0.15
  iou: 0.50
  imgsz: 960

# ── 果梗候选选择参数 ──────────────────────────────────────
stem_selection:
  confidence_weight: 0.60
  position_weight: 0.40

# ── SAM 参数 ──────────────────────────────────────────────
sam:
  box_padding: 0.15
  minimum_mask_area: 20

# ── 正式 SAM3 worker ─────────────────────────────────────
sam3_runtime:
  worker_python: /home/nvidia/thor/Grape_zed/DOBOT_6Axis_ROS2_V4-main/grape_stem_3d_zed_deploy/.venv-thor/bin/python
  worker_script: src/grape_stem_3d/sam3_mask_worker.py
  ready_timeout_s: 300.0
  job_timeout_s: 120.0

# ── 深度采样参数 ──────────────────────────────────────────
depth:
  min_m: 0.05   # Gemini 336 有效深度过滤下限（米）
  max_m: 5.0    # Gemini 336 有效深度过滤上限（米）
  patch_radius: 3
  tolerance_abs_m: 0.02
  tolerance_relative: 0.03
  min_center_neighbors: 3
  search_radius: 12
  minimum_valid_pixels: 3
  use_mask_only: true
  estimator: median
  depth_scale: 0.001  # Gemini 336 SDK 运行时会用实际 m/count 值覆盖

# ── 运行时参数 ────────────────────────────────────────────
runtime:
  detect_every_n_frames: 1
  display: true
  save_on_key: true
  warmup: true
# ── 自动采摘 (与 d/g 按键并存, 不需要时 enabled: false) ──
auto_pick:
  enabled: true               # true: 仅在初始位置附近每 interval_s 自动检测, 目标在机械臂最大工作位点内自动采摘
  interval_s: 0.5             # 自动检测周期 (秒)
  max_base_radius_m: 1.2      # 目标距 base 原点最大距离 (米), 超出不触发 — 按 CR5 最大工作位点留余量, 宽松值
  home_radius_m: 0.05         # 扫描门禁: 机械臂距 home 该半径内才扫描 (流程结束自动回 home, 到位后恢复)

# ── PLC TCP 通信配置 (55 AA 协议 v2.0, 见 PLC_TCP_PROTOCOL.md) ──
# 现场网段: PLC=192.168.0.11  mini box=192.168.0.10  机械臂=192.168.0.13
plc:
  enabled: true                # 是否启用 PLC 通信 (false 时按键手动操作) ⚠ 现场接 PLC 改回 true
  host: "192.168.0.11"             # PLC 服务器 IP (Box 作 TCP 客户端主动连接)
                                # ⚠ 本机联调指向 plc_simulator; 现场改回 "192.168.0.11"
  port: 5000                   # PLC 服务器端口
  reconnect_interval_s: 3.0     # 断线重连间隔 (秒)
  status_interval_s: 1.0        # 心跳/状态周期上报间隔 (秒), PLC 看门狗建议 3 秒
  
  drive:
    enabled: true               # 是否启用驱动器状态上报 (55 AA v2.0 协议)
    done_threshold: 5      # 驱动器状态周期上报间隔 (秒), PLC 看门狗建议 3 秒
    no_target_threshold: 10      # 驱动器状态停更判定 (秒)
    retry_interval_s: 2.0
              # 驱动器状态上报失败重试间隔 (秒)
# # ── 上位机 (HMI) TCP 服务配置 (55 AA 同帧协议, 见 PLC_TCP_PROTOCOL.md §8) ──
# # 角色与 PLC 通道相反: Box 作 TCP 服务器监听, 上位机主动连接 192.168.0.10:5000
# hmi:
#   enabled: false                 # 是否启用上位机服务
#   host: "0.0.0.0"               # 监听地址 (0.0.0.0 = 所有网卡; 若只允许 PLC 网段
#                                 # 访问可改为 "192.168.0.10")
#   port: 20001                    # 监听端口
#   status_interval_s: 1.0        # 心跳/状态周期上报间隔 (秒)

# ── 机械臂 (DOBOT CR5, 服务见 /dobot_bringup_ros2/srv/*) ──
# ── MoveIt 目标位姿发布 (分层: 视觉 → target_pose_transformer → MoveIt) ──
# 姿态来源声明: Position comes from vision;
#              orientation uses predefined harvesting orientation (fixed_rpy_deg)
target_pose:
  camera_target_topic: "/grape_harvest/camera_target"  # run_grasp_pipeline 检测成功发布 (相机系 XYZ, 米)
  target_pose_topic: "/grape_harvest/target_pose"      # grape_arm_control (MoveIt) 订阅
  frame_id: "base_link"                              # MoveIt planning frame (2026-09-19 运行时实测=base_link, 与 C++ 侧校验一致)
  fixed_rpy_deg: [0.0, 0.0, 0.0]                       # 固定采摘姿态 (base 系 Rz·Ry·Rx 固定轴, 现场示教后填)
  gripper_offset_m: [0.02, 0.0, 0.22]                  # 机械臂末端(Link6) → 夹爪工具中心点 平移 (Link6 系, 米)
  tool_mount_rpy_deg: [0.0, 0.0, 0.0]                  # 剪刀工具系相对 Link6 的固定安装旋转 (Rz·Ry·Rx 固定轴, 度, 现场标定后填)
  pose_max_age_s: 2.0                                  # 机械臂位姿超龄判定
  workspace_max_radius_m: 1.2                          # 目标超半径不发布 (CR5 工作半径 ~0.9m, 留余量)
  handeye_yaml: "/home/nvidia/GrapeHarvestControl/handeye_1/handeye_result.yaml"  # 与 robot.handeye_yaml 同文件 (2026-09-19 重解)

# ── 夹爪 (剪刀手) 接近触发 (approach_monitor 节点) ──
# 首次联调务必 dry_run: true, 验证链路后再改 false 接真实剪刀
gripper:
  dry_run: true                        # true: 只打 [GRIPPER] MOCK CLOSE 不碰硬件
  close_distance_threshold_m: 0.03     # 距离阈值 (米, 30mm 起步, 现场按夹爪/定位精度标定)
  approach_confirm_count: 3            # 连续 N 次位姿反馈满足阈值才触发 (防偶然扫过)
  monitor_rate_hz: 10.0                # 距离监控频率
  move_detect_eps_m: 0.001             # 相邻周期位姿变化 >1mm 视为机械臂开始运动
  cut_timeout_s: 15.0                  # 合剪超时 (dry_run=false 时有效)

robot:
  enabled: true                 # false 或 --detect-only → 不调用任何机器人服务
  service_prefix: "/dobot_bringup_ros2/srv"
  wait_service_timeout_s: 10.0  # 启动时等待全部服务出现
  service_timeout_s: 5.0        # 单次服务调用客户端超时 (bringup 内部无超时, 必须兜底)
  service_fail_limit: 2         # 连续服务失败 N 次 → 视为机器人不可用
  pose_topic: "/dobot_msgs_v4/msg/ToolVectorActual"   # x,y,z mm + rx,ry,rz 度 (TCP 位姿)
  status_topic: "/dobot_msgs_v4/msg/RobotStatus"
  pose_timeout_s: 2.0           # 位姿停更判定 (报 FAIL_NO_ROBOT_POSE)
  max_reach_m: 0.9              # 目标距基座超出此半径直接拒绝 (CR5 工作半径边缘, 防远端 MovL→ERROR)
  # 手眼标定: 55 组 TSAI tool 链 (P_base = T_base_tool @ T_tool_camera @ P_camera)
  handeye_yaml: "/home/nvidia/GrapeHarvestControl/handeye_1/handeye_result.yaml"
  speed_factor: 50              # 启动时全局速率比 %, 现场按需调
  motion:
    frame_wait_timeout_s: 0.5   # 流程等新帧超时 (PICKING 中帧停更 → FAIL_CAMERA)
    poll_interval_s: 0.1        # RobotMode 轮询周期 (ABORT 反应 ≤0.1s)
    timeout_s: 60.0             # 单段运动超时 → Stop + FAIL_ROBOT_MOTION
    user_index: 0               # MovL 用户坐标系 (0 = 基座系)
    tool_index: 0               # MovL 工具坐标系 (点位即 TCP 位姿)
    speed_approach_mm_s: 200    # 接近/放果/退回段速度 (speed 数值优先于 v)
    speed_grasp_mm_s: 60        # 抓取段速度 (临近果实减速)
    cp: 0                       # 过渡百分比 0 = 精确停点
    approach_offset_m: [0.0, 0.0, 0.05]    # 接近点 = 目标点 + 该偏移 (base 系, 米)
    place_offset_m: [0.0, 0.0, 0.08]       # 放果点 = 目标点 + 该偏移
    place_position_mm: [-186.8218, -440.4665, 269.6674, -90.2781, 3.8436, 138.7826]  # 固定放果点 (果框) [x,y,z,rx,ry,rz] mm/deg, 基系, 夹爪TCP位姿; 2026-09-20 由 Link6 实测位姿换算 (含 gripper_offset_m 补偿)
    use_dynamic_orientation: true   # 三点动态姿态开关 (calculate_target_pose): 按果梗三点算 rpy; 计算失败或 keypoint 缺失时回退下方示教固定姿态
    send_via_topic: true            # true = PICK 只发布 /target_pose (MoveIt 侧执行), 不调 DOBOT MovL
    home_pose_xyz_m: [0.1549920608, -0.3169755669, 0.1894227201]   # U 键回初始位置 (m), 2026-09-19 现场示教
    home_quat_xyzw: [-0.0210630596, -0.6919377339, 0.7210588172, -0.0292010624]  # [qx,qy,qz,qw]
    end_quat_xyzw: [0.0537246016, -0.6779301530, 0.7328683522, -0.0206966954]  # [qx,qy,qz,qw] 末端固定采摘姿态 (2026-09-20 现场示教, 优先于下方 rpy)
    end_pose_rx_deg: -85.6904   # 末端姿态 (base 系 Rz·Ry·Rx 固定轴, 由上方四元数换算, 兼容旧字段)
    end_pose_ry_deg: -2.9052
    end_pose_rz_deg: -174.0701
  scissors:
    enable: true                # 剪刀手 Modbus 控制
    port: "/dev/ttyAMA5"        # Jetson(thor) 引脚直连 485 (2026-09-20 现场接线); 留空走机械臂末端 485 透传; USB转485 则填 /dev/ttyUSB0 等
    slave_id: 1                 # RS485 从机地址
    baud: 9600                  # N,8,1
    reg_close: 1                # 0x01 电机运行 (写 close_val = 电机轴伸出合剪)
    close_val: 4                # 合剪动作值 (协议: 值取 4)
    reg_open: 10                # 0x0A 回原点 (写 1 = 电机轴缩回开剪)
    reg_motion: 2               # 0x02 运动状态 (1=运动中, 0=停止)
    reg_close_speed: 4          # 0x04 速度 (1-800 圈/min)
    reg_stroke: 5               # 0x05 行程脉冲数 (9000 = 25mm 全行程, 厂家示例值)
    close_speed_rpm: 300
    stroke_pulses: 9000
    cmd_delay_s: 0.2            # 官方建议: 发指令后延时再轮询 0x02
    poll_interval_s: 0.05
    cut_timeout_s: 15.0         # 合剪超时 → FAIL_CUT (先尽力开剪保安全)
    open_timeout_s: 5.0         # 开剪超时 → 退回后报 FAIL_CUT
    # ── send_via_topic 模式时序 (机械臂由 MoveIt 侧执行) ──
    close_delay_s: 2.5          # 发布目标位姿后延时 N 秒再合剪 (等 MoveIt 侧运动到位)
    open_delay_s: 2.5           # 开剪前固定延时, 仅无 TCP 位姿反馈时回退使用
    open_arrive_tolerance_m: 0.01   # 开剪到位判据: 剪切点 (TCP + gripper_offset_m 剪刀手长度) 距放果点 ≤ N 米 (0.01 = 10mm) 即开剪
    open_arrive_timeout_s: 10.0     # 到位判据超时后仍执行开剪 (剪刀不夹持果梗滞留)

# ── 输出配置 ──────────────────────────────────────────────
output:
  root: outputs
  save_rgb: true
  save_depth: true
  save_mask: true
  save_annotated: true
  save_json: true
  save_csv: true
